                rotation: 180
            west_shifted:  
              state: barrier
              entity-renderer:
                item: ultramarine:oak_rafter_shifted
                rotation: 270
          variants:  
            facing=east,shifted=false:  
              appearance: east  
            facing=north,shifted=false:  
              appearance: north  
            facing=south,shifted=false:  
              appearance: south  
            facing=west,shifted=false:  
              appearance: west
            facing=east,shifted=true:  
              appearance: east_shifted  
