items:
# 黑脊正脊厚板
  ultramarine:black_main_roof_ridge_panel:
    material: nether_brick
    data:
      item-name: <!i><lang:item.ultramarine.black_main_roof_ridge_panel>
    model: minecraft:block/custom/black_main_roof_ridge_panel
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 6.0
          is-suffocating: true
          push-reaction: NORMAL
          map-color: 29
          correct_tools: ["#minecraft:pickaxes"]
          required_break_power: 1
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.stone.break
            step: minecraft:block.stone.step
            place: minecraft:block.stone.place
            hit: minecraft:block.stone.hit
            fall: minecraft:block.stone.fall 
        states:
          properties:
            facing:
              type: 4-direction
              default: north
          appearances:
            east:
              state: minecraft:snow[layers=2]
              entity-renderer:
                item: ultramarine:black_main_roof_ridge_panel
                rotation: 90
            north:  
              state: minecraft:snow[layers=2]
              entity-renderer:
                item: ultramarine:black_main_roof_ridge_panel
            south:  
              state: minecraft:snow[layers=2]
              entity-renderer:
                item: ultramarine:black_main_roof_ridge_panel
                rotation: 180
            west:  
              state: minecraft:snow[layers=2]
              entity-renderer:
                item: ultramarine:black_main_roof_ridge_panel
                rotation: 270
          variants:  
            facing=east:  
              appearance: east  
            facing=north:  
              appearance: north  
            facing=south:  
              appearance: south  
            facing=west:  
              appearance: west
