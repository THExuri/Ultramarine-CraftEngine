              state: barrier
              entity-renderer:
                item: ultramarine:oak_rafter_shifted
                rotation: 90
            north_shifted:  
              state: barrier
              entity-renderer:
                item: ultramarine:oak_rafter_shifted
            south_shifted:  
              state: barrier
              entity-renderer:
