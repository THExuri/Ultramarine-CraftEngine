            step: minecraft:block.stone.step
            place: minecraft:block.stone.place
            hit: minecraft:block.stone.hit
            fall: minecraft:block.stone.fall
        states:
          properties:
            facing:
              type: 4-direction
              default: north
          appearances:
            east:
              auto-state: solid
              texture: minecraft:block/custom/layered_cyan_floor_tile
            north:
              auto-state: solid
              model:
                path: minecraft:block/custom/layered_cyan_floor_tile
                y: 180
            south:
              auto-state: solid
              model:
                path: minecraft:block/custom/layered_cyan_floor_tile
            west:
              auto-state: solid
              model:
                path: minecraft:block/custom/layered_cyan_floor_tile
                y: 90
          variants:
            facing=east:
              appearance: east
            facing=north:
              appearance: north
            facing=south:
              appearance: south
            facing=west:
              appearance: west
