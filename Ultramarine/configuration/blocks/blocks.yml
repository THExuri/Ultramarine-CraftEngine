items:
# 青砖
  ultramarine:cyan_brick:
    material: nether_brick
    data:
      item-name: <!i><lang:item.ultramarine.cyan_brick>
    model: minecraft:block/custom/cyan_brick
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 6.0
          is-suffocating: true
          is-redstone-conductor: true
          push-reaction: NORMAL
          map-color: 23
          correct_tools: ["#minecraft:pickaxes"]
          required_break_power: 1
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.stone.break
            step: minecraft:block.stone.step
            place: minecraft:block.stone.place
            hit: minecraft:block.stone.hit
            fall: minecraft:block.stone.fall 
        state:
          auto-state: solid
          texture: minecraft:block/custom/cyan_brick
