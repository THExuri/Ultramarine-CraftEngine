items:
# 橡木木拱
  ultramarine:oak_bracket:
    material: nether_brick
    data:
      item-name: <!i><lang:item.ultramarine.oak_bracket>
    model: minecraft:block/custom/oak_bracket
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self      
        settings:
          hardness: 2.5
          resistance: 2.5
          push-reaction: block
          map-color: 13
          tags: ["minecraft:mineable/axe"]
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
          destroy_stages:
            template: internal:destroy_stages
        states:
          properties:
            facing:
              type: 4-direction
              default: south
          appearances:
            east:
              state: barrier
              entity-renderer:
                item: ultramarine:oak_bracket
                rotation: 270
            north:  
              state: barrier
              entity-renderer:
                item: ultramarine:oak_bracket
                rotation: 180
            south:  
              state: barrier
              entity-renderer:
                item: ultramarine:oak_bracket
            west:  
              state: barrier
              entity-renderer:
                item: ultramarine:oak_bracket
                rotation: 90
          variants:  
            facing=east:  
              appearance: east  
            facing=north:  
              appearance: north  
            facing=south:  
              appearance: south  
            facing=west:  
              appearance: west 
