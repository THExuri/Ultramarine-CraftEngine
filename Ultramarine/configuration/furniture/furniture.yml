items:
# 橡木橱柜
  ultramarine:oak_cabinet:
    material: nether_brick
    data:
      item-name: <!i><lang:item.ultramarine.oak_cabinet>
    model: minecraft:item/custom/oak_cabinet
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:       
        settings:
          item: ultramarine:oak_cabinet
          hit-times: 1
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
        behavior:
          type: simple_storage_furniture
          title: 橡木橱柜
          rows: 3 
          sounds:
            open: minecraft:block.chest.open
            close: minecraft:block.chest.close
        variants:
          ground:
            loot-spawn-offset: 0,0.25,0
            elements:
              - type: item_display
                item: ultramarine:oak_cabinet
                position: 0,0.5,0
            hitboxes:
              - position: 0,0,0
                type: shulker
                peek: 0
                scale: 1
                blocks-building: true
                interactive: true
                interaction-entity: true
                invisible: true 
        loot:
          template: default:loot_table/furniture
          arguments:
            item: ultramarine:oak_cabinet
