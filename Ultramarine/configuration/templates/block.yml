templates:
  ultramarine:block/loot:
    pools:
      - rolls: 1
        entries:
          - type: alternatives
            children:
              - type: item
                item: ${ore_block}
                conditions:
                  - type: enchantment
                    predicate: minecraft:silk_touch>=1
              - type: item
                item: ${ore_drop}
                functions:
                  - type: set_count
                    count: "1~3"
                  - type: apply_bonus
                    enchantment: minecraft:fortune
                    formula:
                      type: ore_drops
                  - type: explosion_decay
  ultramarine:item/loot:
    pools:
      - rolls: 1
        entries:
          - type: item
            item: ${item_drop}
            functions:
              - type: set_count
                count: "1~3"