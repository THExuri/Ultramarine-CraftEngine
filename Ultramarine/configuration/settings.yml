vanilla_loots:  
  ultramarine:fur:
    type: entity  
    target:
      - minecraft:sheep
      - minecraft:goat
      - minecraft:fox
      - minecraft:rabbit
    override: false
    loot:  
      pools:  
        - rolls: 1  
          conditions:  
            - type: table_bonus  
              enchantment: minecraft:looting  
              chances:  
                - 0.1
                - 0.5
                - 0.8
                - 1.0  
          entries:  
            - type: item  
              item: ultramarine:fur
  ultramarine:raw_meat:
